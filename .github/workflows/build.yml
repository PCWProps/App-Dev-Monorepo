name: Build and Test

on:
  push:
    branches: [ main ]
    paths:
      - 'extensions/bearbuddy-free/**'
      - 'extensions/bearbuddy-pro/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'extensions/bearbuddy-free/**'
      - 'extensions/bearbuddy-pro/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          ./extensions/bearbuddy-free/package-lock.json
          ./extensions/bearbuddy-pro/package-lock.json
    
    - name: Install dependencies (Free)
      working-directory: ./extensions/bearbuddy-free
      run: npm install
    
    - name: Install dependencies (Pro)
      working-directory: ./extensions/bearbuddy-pro
      run: npm install
    
    - name: Build BearBuddy Free
      working-directory: ./extensions/bearbuddy-free
      run: npm run build
    
    - name: Build BearBuddy Pro
      working-directory: ./extensions/bearbuddy-pro
      run: npm run build
    
    - name: Run tests (Free)
      working-directory: ./extensions/bearbuddy-free
      run: npm test
    
    - name: Run tests (Pro)
      working-directory: ./extensions/bearbuddy-pro
      run: npm test
    
    - name: Package BearBuddy Free
      working-directory: ./extensions/bearbuddy-free
      run: npm run package
    
    - name: Package BearBuddy Pro
      working-directory: ./extensions/bearbuddy-pro
      run: npm run package
      
    - name: Upload BearBuddy Free artifact
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
      with:
        name: bearbuddy-free-vsix
        path: extensions/bearbuddy-free/*.vsix
        
    - name: Upload BearBuddy Pro artifact
      uses: actions/upload-artifact@v4
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
      with:
        name: bearbuddy-pro-vsix
        path: extensions/bearbuddy-pro/*.vsix
